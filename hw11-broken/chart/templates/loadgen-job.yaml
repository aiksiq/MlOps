{{- if .Values.loadgen.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-loadgen-%s" (include "hw11.fullname" .) .Values.loadgen.runId | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: hw11-loadgen
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  completionMode: Indexed
  completions: {{ .Values.loadgen.clientCount }}
  parallelism: {{ .Values.loadgen.clientCount }}
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.loadgen.durationSeconds 600 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hw11-loadgen
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loadgen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "loadgen.py"]
          args:
            - --url
            - http://{{ include "hw11.fullname" . }}{{ if .Values.loadgen.affinity }}-affinity{{ end }}:{{ .Values.service.port }}
            - --duration
            - {{ .Values.loadgen.durationSeconds | quote }}
            - --total-rps
            - {{ .Values.loadgen.totalRps | quote }}
            - --scenario
            - {{ .Values.loadgen.scenario | quote }}
            - --client-count
            - {{ .Values.loadgen.clientCount | quote }}
            - --concurrency
            - {{ .Values.loadgen.concurrency | quote }}
            - --max-new-tokens
            - {{ .Values.loadgen.maxNewTokens | quote }}
            - --run-id
            - {{ .Values.loadgen.runId | quote }}
            - --output
            - /results/requests.csv
            - --stdout-csv
          env:
            - name: CLIENT_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
