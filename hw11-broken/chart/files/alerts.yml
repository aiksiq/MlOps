groups:
  - name: hw11-inference
    rules:
      - alert: InferenceTTFCHigh
        expr: |
          (
            sum(rate(inference_ttfc_seconds_bucket{le="0.5"}[5m]))
            /
            sum(rate(inference_ttfc_seconds_count[5m]))
          ) < 0.95
          and
          sum(increase(inference_requests_total{outcome="completed"}[5m])) >= 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of first chunks exceed 500 ms"
      - alert: InferenceFailureRatioHigh
        expr: |
          (
            sum(rate(inference_requests_total{outcome=~"rejected|aborted"}[5m]))
            /
            clamp_min(sum(rate(inference_requests_total[5m])), 0.000001)
          ) > 0.05
          and
          sum(increase(inference_requests_total[5m])) >= 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Inference rejected or aborted request ratio exceeds 5%"
