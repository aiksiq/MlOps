name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-fast.txt
        working-directory: hw8910-broken
      - run: python -m compileall -q release.py lab.py service.py api.py api_server.py inference.py prefect_flow.py hw67_integration.py benchmark_api.py tests
        working-directory: hw8910-broken
      - run: python -m unittest discover -s tests -v
        working-directory: hw8910-broken
