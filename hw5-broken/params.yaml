# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4             # эффективный батч = 8: память как у батча 2, шаг как у батча 8
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 2
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "Тема:\nОстрый коронарный синдром\n\nВопрос:\nКакой препарат следует назначить пациенту с подозрением на острый коронарный синдром при отсутствии противопоказаний?\n\nВарианты ответа:\n0. ацетилсалициловая кислота\n1. амоксициллин\n2. омепразол\n3. фуросемид"
    - "Тема:\nХроническая обструктивная болезнь лёгких\n\nВопрос:\nКакой метод спирометрической диагностики подтверждает стойкую бронхиальную обструкцию?\n\nВарианты ответа:\n0. ОФВ1/ФЖЕЛ менее 0,70 после бронходилататора\n1. ОФВ1/ФЖЕЛ более 0,90 до бронходилататора\n2. увеличение жизненной ёмкости лёгких на 5 процентов\n3. снижение пиковой скорости выдоха однократно"
    - "Тема:\nФибрилляция предсердий\n\nВопрос:\nКакой метод позволяет подтвердить фибрилляцию предсердий?\n\nВарианты ответа:\n0. электрокардиография\n1. рентгенография грудной клетки\n2. общий анализ мочи\n3. спирометрия"
    - "Тема:\nВнебольничная пневмония у взрослых\n\nВопрос:\nКакой признак является основным рентгенологическим критерием пневмонии?\n\nВарианты ответа:\n0. очаговая или инфильтративная тень в лёгком\n1. расширение корней лёгких без инфильтрации\n2. изолированное увеличение размеров сердца\n3. свободный газ под диафрагмой"
    - "Тема:\nСахарный диабет 2 типа\n\nВопрос:\nКакой показатель используют для оценки среднего уровня гликемии примерно за последние три месяца?\n\nВарианты ответа:\n0. гликированный гемоглобин HbA1c\n1. глюкоза крови натощак за один день\n2. уровень инсулина после еды\n3. кетоны в моче"
  system: "Ты отвечаешь на русскоязычные тестовые вопросы НМО. Дан вопрос и варианты ответа с нумерацией с 0. Выбери один правильный вариант. Ответь только номером варианта и текстом ответа, без объяснений."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
